[general]
name = "idol-cuda"
version = 1
edition = 6
license = "Apache-2.0"
backends = ["cuda"]
source = "https://github.com/suvadityamuk/idol-cuda"

[general.hub]
repo-id = "suvadityamuk/idol-cuda"

[torch]
src = [
    "torch-ext/torch_binding.cpp",
    "torch-ext/torch_binding.h",
]

[kernel.idol_cuda]
language = "cpp-cuda"
depends = ["torch"]
cuda-capabilities = ["8.0", "8.6", "8.9", "9.0", "10.0", "12.0"]
src = [
    "idol_cuda/idol_kernels.cu",
    "idol_cuda/idol_kernels.h",
]
